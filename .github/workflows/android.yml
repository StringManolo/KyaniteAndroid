name: Android Native CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  create:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
            with_vm: 'true'
            release_apk: Kyanite.apk
            debug_apk: KyaniteAndroid-debug-arm64-v8a.apk
          - arch: armv7
            abi: armeabi-v7a
            with_vm: 'false'
            release_apk: kyanite_v7.apk
            debug_apk: KyaniteAndroid-debug-armeabi-v7a.apk

    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 📥 Prepare proot / QEMU / Kyanite assets (${{ matrix.arch }})
        uses: ./.github/actions/prepare-assets
        with:
          arch: ${{ matrix.arch }}
          with-vm: ${{ matrix.with_vm }}

      - name: 🏗️ Build Debug APK
        run: gradle assembleDebug -PtargetAbi=${{ matrix.abi }} --stacktrace

      - name: 📦 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ matrix.abi }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 🔐 Config APK Signature
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          KEYSTORE_PATH=$RUNNER_TEMP/release.jks
          echo "$KEYSTORE_BASE64" | base64 -d > $KEYSTORE_PATH
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 🎯 Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gradle assembleRelease -PtargetAbi=${{ matrix.abi }} --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "${{ matrix.release_apk }}"

      - name: 📦 Upload Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ matrix.abi }}
          path: ${{ matrix.release_apk }}
          retention-days: 30

      - name: 🚀 Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Kyanite ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ matrix.release_apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
